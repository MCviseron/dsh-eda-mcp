name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # build.mjs packages the JLCEDA extension with PowerShell Compress-Archive,
    # so the job runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm (from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Contract check
        run: pnpm contract-check

      - name: Build
        run: pnpm build

      - name: Guard - no build-machine paths in the bundles
        run: pnpm guard:bundle

      # The build writes ONE versioned zip (dsh-eda-bridge-extension-<version>.zip) and
      # deliberately keeps no unversioned alias, so this must glob, not name a fixed file:
      # a fixed name made the whole check workflow fail with if-no-files-found: error.
      - name: Upload the EDA bridge extension
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eda-bridge-extension
          path: dsh-eda-bridge-extension-*.zip
          if-no-files-found: error
